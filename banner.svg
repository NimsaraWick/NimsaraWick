<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0E1B18"/>
      <stop offset="50%" stop-color="#0A0E13"/>
      <stop offset="100%" stop-color="#06080B"/>
    </radialGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A88F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00A88F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00A88F" stop-opacity="0"/>
    </linearGradient>
    <filter id="nodeGlow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="haloBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="vignette" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="220" fill="#000000" opacity="0" />
  <rect x="0" y="0" width="1200" height="1" fill="#00A88F" opacity="0.5"/>
  <rect x="0" y="279" width="1200" height="1" fill="#00A88F" opacity="0.5"/>

  <!-- soft vignette at the very edges for depth -->
  <rect x="-40" y="-40" width="120" height="360" fill="#000000" opacity="0.35" filter="url(#vignette)"/>
  <rect x="1120" y="-40" width="120" height="360" fill="#000000" opacity="0.35" filter="url(#vignette)"/>

  <!-- hub halo -->
  <circle cx="600" cy="140" r="110" fill="#00A88F" opacity="0.08" filter="url(#haloBlur)"/>

  <!-- constellation connective lines -->
  <g stroke="#00A88F" stroke-width="0.8" opacity="0.15">
    <line x1="600" y1="140" x2="140" y2="55"/>
    <line x1="600" y1="140" x2="140" y2="225"/>
    <line x1="600" y1="140" x2="1060" y2="55"/>
    <line x1="600" y1="140" x2="1060" y2="225"/>
    <line x1="140" y1="55" x2="90" y2="140"/>
    <line x1="140" y1="225" x2="90" y2="140"/>
    <line x1="1060" y1="55" x2="1110" y2="140"/>
    <line x1="1060" y1="225" x2="1110" y2="140"/>
    <line x1="140" y1="55" x2="222" y2="92"/>
    <line x1="140" y1="225" x2="222" y2="190"/>
    <line x1="1060" y1="55" x2="978" y2="92"/>
    <line x1="1060" y1="225" x2="978" y2="190"/>
  </g>

  <!-- traveling signal pulses -->
  <circle r="2.2" fill="#7FF3D6">
    <animateMotion path="M 600 140 L 140 55" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#7FF3D6">
    <animateMotion path="M 600 140 L 1060 55" dur="4.8s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4.8s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- texture nodes (static) -->
  <g fill="#00A88F" opacity="0.32">
    <circle cx="90" cy="140" r="2"/>
    <circle cx="222" cy="92" r="2"/>
    <circle cx="222" cy="190" r="2"/>
    <circle cx="1110" cy="140" r="2"/>
    <circle cx="978" cy="92" r="2"/>
    <circle cx="978" cy="190" r="2"/>
  </g>

  <!-- hub node -->
  <circle cx="600" cy="140" r="5.5" fill="#00E0B8" filter="url(#nodeGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- corner nodes -->
  <g>
    <circle cx="140" cy="55" r="5" fill="#00A88F" filter="url(#nodeGlow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="225" r="5" fill="#00A88F" filter="url(#nodeGlow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="55" r="5" fill="#00A88F" filter="url(#nodeGlow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="225" r="5" fill="#00A88F" filter="url(#nodeGlow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- corner frame brackets, gallery-label style -->
  <g stroke="#00A88F" stroke-width="1" opacity="0.4" fill="none">
    <path d="M 26 20 L 26 34 M 26 20 L 40 20"/>
    <path d="M 1174 20 L 1174 34 M 1174 20 L 1160 20"/>
    <path d="M 26 260 L 26 246 M 26 260 L 40 260"/>
    <path d="M 1174 260 L 1174 246 M 1174 260 L 1160 260"/>
  </g>

  <!-- name -->
  <text x="600" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#F5F7F6">NIMSARA</text>
  <text x="600" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="7" fill="#9FB6B0">WICKRAMATHANTHRI</text>

  <!-- fine rule beneath the wordmark -->
  <rect x="560" y="184" width="80" height="1" fill="url(#edgeFade)"/>

  <!-- signature watermarks -->
  <text x="52" y="264" font-family="'Courier New', Consolas, monospace" font-size="10" letter-spacing="2" fill="#00A88F" opacity="0.4">NW</text>
  <text x="1148" y="264" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#00A88F" opacity="0.4">nimsarawick.vercel.app</text>
</svg>
